<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zheng Jinpeng | Personal introduction</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #1b302a;
      background: #edf3ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: clamp(1rem, 7vw, 5rem) 1rem;
    }

    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3rem);
      background: #fffdf8;
      border: 1px solid #cad8d0;
      border-top: 4px solid #2e6659;
      border-radius: 1rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.25rem;
    }

    header > div {
      flex: 1 1 17rem;
    }

    .avatar {
      flex-shrink: 0;
    }

    .university {
      color: #2e6659;
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1 {
      margin: 0.25rem 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .program {
      color: #42574f;
    }

    section {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid #d9e3dc;
    }

    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }

    p, ul {
      margin: 0;
    }

    ul {
      padding-left: 1.25rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <svg class="avatar" width="96" height="96" viewBox="0 0 96 96"
        role="img" aria-label="Avatar with the initials ZJ">
        <circle cx="48" cy="48" r="48" fill="#23574b" />
        <text x="48" y="49" fill="#ffffff" font-size="32" font-weight="700"
          text-anchor="middle" dominant-baseline="middle">ZJ</text>
      </svg>
      <div>
        <p class="university">Corvinus University of Budapest</p>
        <h1>Zheng Jinpeng</h1>
        <p class="program">MSc in Advanced Supply Chain Management · Year 1</p>
      </div>
    </header>

    <section>
      <h2>About me</h2>
      <p>Hi, I’m Janó. I’m interested in procurement, especially how manufacturers decide what to make in-house and what to buy from suppliers.</p>
    </section>

    <section>
      <h2>Hobbies</h2>
      <ul>
        <li>Swimming</li>
        <li>Table tennis</li>
        <li>Working out</li>
      </ul>
    </section>
  </main>
</body>
</html>
